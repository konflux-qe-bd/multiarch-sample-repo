        - name: bundle
          value: quay.io/konflux-ci/pull-request-builds:sast-unicode-check-oci-ta-0.2@sha256:0dcd1a85a6985ab56f417e51bdf3b957d79c8471c9cc1820be9566624666cfb4
        - name: kind
